apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
data:
  database-url: cG9zdGdyZXM6Ly9hZG1pbjoxMjM0NUBkYXRhYmFzZTo1NDMyL2NvbXB1dGV4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-deployment  #  match hostname in settings.py
  labels:
    app: database  #  match hostname in settings.py
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database  # match hostname in settings.py
  template:
    metadata:
      labels:
        app: database  # match hostname in settings.py
    spec:
      containers:
      - name: postgres
        image: postgres:13
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          value: "12345"  # match settings.py
        - name: POSTGRES_USER
          value: "admin"  # match settings.py
        - name: POSTGRES_DB
          value: "computex"  # match settings.py
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: database  # match hostname in settings.py
spec:
  selector:
    app: database  # match hostname in settings.py
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP