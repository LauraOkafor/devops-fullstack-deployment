version: '3.9'

services:
  backend:
    container_name: django-app
    # image: lauraokafor/project:backend
    build: ./Computex
    ports:
      - "8000:8000"
   

  frontend:
    container_name: react-app
    # image: lauraokafor/project:frontend
    build: ./ComputexFrontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  database:
    image: postgres
    # container_name: database
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=12345
      - POSTGRES_DB=computex
    volumes:
      - ddata:/var/lib/postgresql/data
      # - ./postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d computex"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ddata: