---
- name: Install Kubernetes dependencies
  hosts: all
  become: true
  tasks:
    - name: Update package cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - containerd.io
        state: present

    - name: Add Kubernetes apt key
      shell: |
        curl -s https://packages.cloud.google.com/apt/doc/apt-key.gpg | apt-key add -

    - name: Add Kubernetes repository
      apt_repository:
        repo: deb https://apt.kubernetes.io/ kubernetes-xenial main
        state: present

    - name: Install kubelet, kubeadm, kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Configure system for Kubernetes
      shell: |
        # Load br_netfilter module
        modprobe br_netfilter
        
        # Set bridge networking parameters
        echo "net.bridge.bridge-nf-call-iptables = 1" > /etc/sysctl.d/k8s.conf
        echo "net.bridge.bridge-nf-call-ip6tables = 1" >> /etc/sysctl.d/k8s.conf
        sysctl --system
        
        # Disable swap
        swapoff -a
        sed -i '/swap/s/^/#/' /etc/fstab
        
        # Configure containerd to use systemd cgroup driver
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
        systemctl restart containerd

- name: Set up Kubernetes master node
  hosts: frontend
  become: true
  tasks:
    - name: Initialize Kubernetes cluster
      shell: kubeadm init --pod-network-cidr=10.244.0.0/16 --apiserver-advertise-address={{ ansible_host }}
      register: init_output
      ignore_errors: yes

    - name: Set up kubectl for user
      shell: |
        mkdir -p /home/{{ ansible_user }}/.kube
        cp /etc/kubernetes/admin.conf /home/{{ ansible_user }}/.kube/config
        chown -R {{ ansible_user }}:{{ ansible_user }} /home/{{ ansible_user }}/.kube
      when: init_output is success

    - name: Install Flannel network plugin
      become: false
      shell: kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      when: init_output is success

    - name: Get join command
      shell: kubeadm token create --print-join-command
      register: join_command_raw
      when: init_output is success

    - name: Set join command as fact
      set_fact:
        join_command: "{{ join_command_raw.stdout }}"
      when: join_command_raw is defined and join_command_raw.stdout is defined

- name: Join worker nodes to cluster
  hosts: backend,database
  become: true
  tasks:
    - name: Join the Kubernetes cluster
      shell: "{{ hostvars['vm_frontend']['join_command'] }}"
      when: hostvars['vm_frontend'] is defined and hostvars['vm_frontend']['join_command'] is defined