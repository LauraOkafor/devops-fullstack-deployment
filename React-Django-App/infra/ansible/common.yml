---

- name: Copy the PEM file to the VM
  copy:
    src: /Users/m1/Downloads/project.pem
    dest: /home/ubuntu/.ssh/project.pem
    mode: '0600'
  become_user: ubuntu

- name: Set correct permissions on the PEM key
  file:
    path: /home/ubuntu/.ssh/project.pem
    mode: '0600'
    owner: ubuntu
    group: ubuntu

- name: Update and upgrade apt packages
  apt:
    update_cache: yes
    upgrade: yes

- name: Add Docker GPG apt key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present

- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Install Docker Compose
  get_url:
    url: https://github.com/docker/compose/releases/download/v2.18.1/docker-compose-linux-x86_64
    dest: /usr/local/bin/docker-compose
    mode: '0755'

- name: Start Docker service
  service:
    name: docker
    state: started
    enabled: yes

- name: Add user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes